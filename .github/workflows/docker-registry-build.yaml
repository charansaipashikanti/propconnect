name: docker pipeline build
run-name: docker pipeline build

on:
  workflow_dispatch:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: pavansaipashikanti/propconnect:latest
          file: docker/Dockerfile

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: pavansaipashikanti/propconnect-frontend:latest
          file: docker/frontend.Dockerfile

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: pavansaipashikanti/propconnect-backend:latest
          file: docker/backend.Dockerfile