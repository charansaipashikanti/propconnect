apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "propconnect.fullname" . }}-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "propconnect.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.backendPort | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}