apiVersion: v1
kind: Service
metadata:
  name: {{ include "propconnect.fullname" . }}-frontend
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "propconnect.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "propconnect.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http