name: docker pipeline
run-name: propconnect

on:
  workflow_dispatch:
  # push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: pavansaipashikanti/propconnect:latest
          file: docker/Dockerfile


      - name: Install Docker on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Docker if not already installed
            if ! command -v docker &> /dev/null; then
              sudo apt update
              sudo apt install docker.io -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
              echo "Docker installed successfully"
            else
              echo "Docker already installed: $(docker --version)"
            fi


      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu

            # Create .env file
            cat << EOF > .env
            MONGO_URI=mongodb+srv://${{ secrets.MONGO_USER }}:${{ secrets.MANGO_PASSWORD }}@cluster0.lmzuqki.mongodb.net/real-estate-platform?appName=Cluster0
            FRONTEND_URL=http://${{ secrets.EC2_HOST }}
            JWT_EXPIRE=30d
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            PORT=5000
            EOF

            docker login -u ${{ vars.DOCKERUSERNAME }} -p ${{ secrets.DOCKERTOKEN }}
            docker pull pavansaipashikanti/propconnect:latest
            docker stop propconnect || true
            docker rm propconnect || true

            docker run -d --name propconnect --restart always -p 80:5000 --env-file /home/ubuntu/.env pavansaipashikanti/propconnect:latest


