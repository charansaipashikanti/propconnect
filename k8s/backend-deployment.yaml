apiVersion: apps/v1
kind: Deployment
metadata:
  name: propconnect-backend
  namespace: propconnect
  labels:
    app.kubernetes.io/name: propconnect
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: propconnect
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: propconnect
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: propconnect
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: propconnect
    spec:
      serviceAccountName: propconnect-app
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: pavansaipashikanti/propconnect-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: propconnect-config
            - secretRef:
                name: propconnect-backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
