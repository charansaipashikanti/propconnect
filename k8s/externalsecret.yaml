apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: propconnect-backend
  namespace: propconnect
  labels:
    app.kubernetes.io/name: propconnect
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: propconnect
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: propconnect-secret-store
    kind: ClusterSecretStore
  target:
    name: propconnect-backend-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: propconnect/production/backend
        property: MONGO_URI
    - secretKey: JWT_SECRET
      remoteRef:
        key: propconnect/production/backend
        property: JWT_SECRET
    - secretKey: JWT_EXPIRE
      remoteRef:
        key: propconnect/production/backend
        property: JWT_EXPIRE
