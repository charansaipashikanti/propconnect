apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: propconnect-frontend
  namespace: propconnect
  labels:
    app.kubernetes.io/name: propconnect
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: propconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: propconnect-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
