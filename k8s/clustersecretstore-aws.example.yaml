apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: propconnect-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      # This example expects the External Secrets Operator controller pod
      # to already have AWS permissions through EKS IRSA or EKS Pod Identity.
      # No static AWS access keys are stored in Kubernetes.
